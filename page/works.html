<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>你的紫色宇宙・創作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:       #b19cd9;
      --primary-dark:  #967bb6;
      --primary-light: #d7c8e8;
      --accent:        #81d8d0;
      --accent-dark:   #5fb3ac;
      --bg:            #f5f0ff;
      --bg-gradient:   linear-gradient(135deg, #f5f0ff 0%, #e8e0ff 100%);
      --card:          #ffffff;
      --text:          #4a3c5e;
      --text-light:    #6b5a8a;
      --shadow:        0 12px 40px rgba(177, 156, 217, 0.18);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', 'Noto Sans TC', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0; width: 100%;
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(245, 240, 255, 0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(177, 156, 217, 0.2);
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      margin-left: 2.5rem;
      font-weight: 500;
      transition: all 0.3s;
    }
    .nav-links a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    main { padding-top: 140px; padding-bottom: 8rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 5%; }

    h1 {
      font-size: clamp(3.5rem, 8vw, 6.2rem);
      font-weight: 800;
      background: linear-gradient(90deg, #d7c8e8, #b19cd9, #81d8d0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      margin-bottom: 4rem;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2.8rem;
    }

    .work-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: all 0.4s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .work-card:hover {
      transform: translateY(-14px);
      box-shadow: 0 30px 70px rgba(129,216,208,0.22);
    }

    .work-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .work-card:hover .work-img {
      transform: scale(1.07);
    }

    .work-info {
      padding: 1.8rem 1.6rem;
    }

    .work-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: var(--primary);
    }

    .work-desc {
      font-size: 1rem;
      color: var(--text-light);
    }

    .category {
      font-size: 0.9rem;
      color: var(--accent);
      margin-top: 1rem;
      display: inline-block;
    }

    @media (max-width: 768px) {
      .works-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">紫色夢境</a>
    <div class="nav-links">
      <a href="about.html">關於我</a>
      <a href="works.html">創作</a>
      <a href="contact.html">聯繫</a>
    </div>
  </nav>

  <main>
    <div class="container">
      <h1>創作集</h1>

      <div class="works-grid">

        <a href="#" class="work-card">
          <img src="https://via.placeholder.com/600x400/f5f0ff/b19cd9?text=Soft+Lavender" alt="作品1" class="work-img">
          <div class="work-info">
            <h3 class="work-title">Lavender Whisper</h3>
            <p class="work-desc">薰衣草田遇見晨霧的柔和一刻</p>
            <span class="category">數位插畫</span>
          </div>
        </a>

        <a href="#" class="work-card">
          <img src="https://via.placeholder.com/600x400/f5f0ff/81d8d0?text=Tiffany+Dream" alt="作品2" class="work-img">
          <div class="work-info">
            <h3 class="work-title">Tiffany Afternoon</h3>
            <p class="work-desc">午後陽光灑在Tiffany藍色調的靜物</p>
            <span class="category">氛圍攝影＋後製</span>
          </div>
        </a>

        <a href="#" class="work-card">
          <img src="https://via.placeholder.com/600x400/e8e0ff/967bb6?text=Ethereal+Flow" alt="作品3" class="work-img">
          <div class="work-info">
            <h3 class="work-title">Ethereal Flow</h3>
            <p class="work-desc">流動的紫色光影與透明感實驗</p>
            <span class="category">動態視覺</span>
          </div>
        </a>

        <!-- 可繼續增加更多卡片 -->

      </div>
    </div>
  </main>

</body>
</html>
