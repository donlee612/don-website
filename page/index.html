<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>你的紫色宇宙・首頁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary:       #b19cd9;
      --primary-dark:  #967bb6;
      --primary-light: #d7c8e8;
      --accent:        #81d8d0;
      --accent-dark:   #5fb3ac;
      --bg:            #f5f0ff;
      --bg-gradient:   linear-gradient(135deg, #f5f0ff 0%, #e8e0ff 100%);
      --card:          #ffffff;
      --text:          #4a3c5e;
      --text-light:    #6b5a8a;
      --shadow:        0 12px 40px rgba(177, 156, 217, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Noto Sans TC', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(245, 240, 255, 0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(177, 156, 217, 0.2);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      margin-left: 2.5rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    .hero {
      height: 100vh;
      min-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 5%;
      background: var(--bg-gradient);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(129,216,208,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-content {
      max-width: 960px;
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: clamp(3.8rem, 9vw, 7.2rem);
      font-weight: 800;
      margin-bottom: 1.4rem;
      line-height: 1.05;
      background: linear-gradient(90deg, #d7c8e8, #b19cd9, #81d8d0, #b19cd9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 200% auto;
      animation: gradientFlow 12s ease infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hero p {
      font-size: 1.45rem;
      color: var(--text-light);
      margin-bottom: 3rem;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-block;
      padding: 1.1rem 2.5rem;
      background: linear-gradient(45deg, var(--primary), var(--primary-dark));
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1.15rem;
      transition: all 0.4s ease;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 25px 50px rgba(129,216,208,0.28);
      background: linear-gradient(45deg, var(--accent), #81d8d0);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      margin-left: 1.8rem;
    }

    .btn-outline:hover {
      background: rgba(129,216,208,0.08);
      border-color: var(--accent-dark);
      color: var(--accent-dark);
    }

    .scroll-down {
      position: absolute;
      bottom: 3.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      color: var(--text-light);
      opacity: 0.8;
      animation: bounce 3s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -16px); }
      60% { transform: translate(-50%, -8px); }
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero h1 { font-size: clamp(3rem, 11vw, 5.2rem); }
      .hero p { font-size: 1.25rem; }
      .btn, .btn-outline { padding: 0.95rem 2rem; font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">紫色夢境</a>
    <div class="nav-links">
      <a href="about.html">關於我</a>
      <a href="works.html">創作</a>
      <a href="contact.html">聯繫</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>沉浸在<br>柔和的紫色時光</h1>
      <p>這裡是薰衣草與Tiffany藍交織的夢幻空間，每一像素都輕輕呼吸著清新。</p>
      
      <div style="margin-top: 2.5rem;">
        <a href="works.html" class="btn">進入夢境</a>
        <a href="about.html" class="btn btn-outline">探索更多</a>
      </div>
    </div>

    <div class="scroll-down">向下滑動 • 繼續沉浸 ↓</div>
  </section>

</body>
</html>
